# Runs on every pull request. Needs no AWS credentials: it only builds the
# bundles and runs the tests.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --requirement requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: pytest

  detect:
    name: Detect functions
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          set -euo pipefail
          JSON=$(
            find . -mindepth 2 -maxdepth 2 -name lambda_function.py -printf '%h\n' \
              | sed 's|^\./||' | sort | while IFS= read -r fn; do
                  runtime=$(jq -r '.runtime // "python3.13"' "$fn/deploy.json" 2>/dev/null \
                            || echo python3.13)
                  jq -nc --arg name "$fn" --arg py "${runtime#python}" \
                     '{name: $name, python_version: $py}'
                done | jq -sc .
          )
          echo "functions=$JSON" >> "$GITHUB_OUTPUT"

  # update-function-code accepts any zip, so a bundle missing a dependency only
  # fails when the function is invoked. Build it here and import it.
  bundle:
    name: Bundle ${{ matrix.name }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.functions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Build and import the bundle
        env:
          FUNCTION: ${{ matrix.name }}
        run: |
          set -euo pipefail

          BUILD="$RUNNER_TEMP/build/$FUNCTION"
          mkdir -p "$BUILD"
          cp -R "$FUNCTION/." "$BUILD/"

          if [ -f "$BUILD/requirements.txt" ]; then
            pip install --quiet --requirement "$BUILD/requirements.txt" --target "$BUILD"
            rm "$BUILD/requirements.txt"
          fi
          rm -f "$BUILD/deploy.json"

          ( cd "$BUILD" && python -c 'import lambda_function as m; assert callable(m.lambda_handler)' )

          UNPACKED=$(du -sb "$BUILD" | cut -f1)
          echo "Unpacked bundle: $((UNPACKED / 1024 / 1024)) MiB"
          if [ "$UNPACKED" -gt $((250 * 1024 * 1024)) ]; then
            echo "::error::$FUNCTION exceeds the 250 MiB unpacked limit"
            exit 1
          fi
