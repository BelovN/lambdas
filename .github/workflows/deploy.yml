# Deploys Lambdas to AWS on push or merge to main.
#
# A function directory is one holding a lambda_function.py, and its name must
# equal the function name in AWS. Only changed directories are deployed.
#
# One-time setup:
#   1. In AWS, create an OIDC identity provider for
#      token.actions.githubusercontent.com (audience sts.amazonaws.com) and an
#      IAM role granting lambda:UpdateFunctionCode,
#      lambda:UpdateFunctionConfiguration and lambda:GetFunction.
#   2. Write the role's trust policy sub condition in GitHub's NEW format,
#      which substitutes numeric owner and repo ids into the claim:
#        repo:BelovN@68339775/lambdas@1355115369:ref:refs/heads/main
#      The old repo:BelovN/lambdas:ref:refs/heads/main form no longer matches
#      and fails sts:AssumeRoleWithWebIdentity with AccessDenied. The real sub
#      is always visible in the CloudTrail AssumeRoleWithWebIdentity event.
#   3. Settings -> Secrets and variables -> Actions:
#        secret AWS_ROLE_ARN  - the ARN of that role
#        variable AWS_REGION  - the region the Lambdas live in (eu-north-1)

name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names (empty deploys all)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambdas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed functions
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FUNCTIONS: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t ALL < <(
            find . -mindepth 2 -maxdepth 2 -name lambda_function.py -printf '%h\n' \
              | sed 's|^\./||' | sort
          )

          # Keeps only the stdin lines that really are function directories.
          pick() { grep -Fxf <(printf '%s\n' "${ALL[@]}") || true; }

          if [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUT_FUNCTIONS" ]; then
            SELECTED=$(printf '%s\n' $INPUT_FUNCTIONS | pick)
          elif [ "$EVENT" = workflow_dispatch ]; then
            SELECTED=$(printf '%s\n' "${ALL[@]}")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            SELECTED=$(git diff --name-only "$BEFORE" "$SHA" | cut -s -d/ -f1 | sort -u | pick)
          else
            # First push to a branch, or a force-push: no base to diff against.
            SELECTED=$(printf '%s\n' "${ALL[@]}")
          fi

          # Runtime and architecture come from the function's deploy.json: the
          # build must use the same Python and architecture, or pip puts
          # incompatible wheels in the bundle and the function dies with
          # ImportModuleError.
          JSON=$(printf '%s\n' "$SELECTED" | sed '/^$/d' | while IFS= read -r fn; do
            runtime=$(jq -r '.runtime // "python3.13"' "$fn/deploy.json" 2>/dev/null || echo python3.13)
            arch=$(jq -r '.architecture // "x86_64"' "$fn/deploy.json" 2>/dev/null || echo x86_64)
            jq -nc --arg name "$fn" --arg py "${runtime#python}" --arg arch "$arch" \
              '{name: $name,
                python_version: $py,
                architecture: $arch,
                env_secret: ("LAMBDA_ENV_" + ($name | ascii_upcase | gsub("-"; "_")))}'
          done | jq -sc .)
          echo "Functions to deploy: $JSON"
          echo "functions=$JSON" >> "$GITHUB_OUTPUT"
          if [ "$JSON" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.functions) }}
    steps:
      - uses: actions/checkout@v4

      # Must match the Lambda runtime: pip resolves interpreter-specific
      # wheels, and a cp312 wheel will not import on python3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-deploy-${{ matrix.name }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # Dependencies go inside the zip: this account uses no Lambda layers.
      - name: Build the zip
        env:
          FUNCTION: ${{ matrix.name }}
          ARCH: ${{ matrix.architecture }}
          PY: ${{ matrix.python_version }}
        run: |
          set -euo pipefail

          BUILD="$RUNNER_TEMP/build/$FUNCTION"
          mkdir -p "$BUILD"
          cp -R "$FUNCTION/." "$BUILD/"

          if [ -f "$BUILD/requirements.txt" ]; then
            PIP_ARGS=(--quiet --requirement "$BUILD/requirements.txt" --target "$BUILD")
            if [ "$ARCH" = arm64 ]; then
              # The runner is x86_64, so arm64 wheels must be requested
              # explicitly or the bundle gets the wrong binaries.
              PIP_ARGS+=(--platform manylinux2014_aarch64 --implementation cp
                         --python-version "$PY" --only-binary=:all:)
            fi
            pip install "${PIP_ARGS[@]}"
            rm "$BUILD/requirements.txt"
          fi
          rm -f "$BUILD/deploy.json"

          # update-function-code accepts any zip, so a bundle missing a
          # dependency only fails when the function is invoked. Nothing on an
          # x86_64 runner can import an arm64 bundle.
          if [ "$ARCH" != arm64 ]; then
            ( cd "$BUILD" && python -c 'import lambda_function as m; assert callable(m.lambda_handler)' )
            echo "Bundle imports cleanly."
          fi

          cd "$BUILD"
          zip -qr "$RUNNER_TEMP/$FUNCTION.zip" . \
            -x '*.pyc' -x '*__pycache__*' -x '.DS_Store'
          unzip -l "$RUNNER_TEMP/$FUNCTION.zip" | tail -1

      # An existing function is updated; a missing one is created from
      # deploy.json. Without deploy.json there is nothing to create from, which
      # fails the job rather than skipping quietly.
      - name: Create or update the function
        env:
          FUNCTION: ${{ matrix.name }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/$FUNCTION.zip"

          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION" \
              --zip-file "fileb://$ZIP" \
              --publish \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION"
            echo "Function code updated."
            exit 0
          fi

          CFG="$FUNCTION/deploy.json"
          if [ ! -f "$CFG" ]; then
            echo "::error::$FUNCTION is not in AWS and $CFG is missing - nothing to create it from."
            exit 1
          fi

          aws lambda create-function \
            --function-name "$FUNCTION" \
            --runtime "$(jq -r '.runtime' "$CFG")" \
            --role "$(jq -r '.role' "$CFG")" \
            --handler "$(jq -r '.handler' "$CFG")" \
            --architectures "$(jq -r '.architecture // "x86_64"' "$CFG")" \
            --timeout "$(jq -r '.timeout // 30' "$CFG")" \
            --memory-size "$(jq -r '.memory_size // 128' "$CFG")" \
            --zip-file "fileb://$ZIP" \
            --publish \
            --no-cli-pager >/dev/null
          aws lambda wait function-active-v2 --function-name "$FUNCTION"
          echo "Function created."

          if [ "$(jq -r '.function_url // false' "$CFG")" = "true" ]; then
            # Since October 2025 a Function URL requires BOTH permissions.
            # With only the first, every request gets a 403 even with auth
            # type NONE.
            aws lambda add-permission \
              --function-name "$FUNCTION" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal '*' \
              --function-url-auth-type NONE \
              --no-cli-pager >/dev/null
            aws lambda add-permission \
              --function-name "$FUNCTION" \
              --statement-id FunctionURLInvokeAllowPublicAccess \
              --action lambda:InvokeFunction \
              --principal '*' \
              --invoked-via-function-url \
              --no-cli-pager >/dev/null
            URL=$(aws lambda create-function-url-config \
              --function-name "$FUNCTION" \
              --auth-type NONE \
              --query FunctionUrl --output text)
            echo "Function URL: $URL"
            echo "Function URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The LAMBDA_ENV_<FUNCTION_NAME> secret (uppercased, hyphens to
      # underscores) must be a JSON object {"VAR": "value"}. It REPLACES the
      # function's whole environment map, so edits made in the AWS console are
      # wiped. With no such secret the step does nothing.
      #
      # Exactly one secret is passed, addressed by a name from the matrix.
      # toJSON(secrets) must not be used: dumping every secret at once is the
      # canonical exfiltration pattern, and GitHub holds such runs for manual
      # approval as potentially malicious.
      - name: Update environment variables
        env:
          FUNCTION: ${{ matrix.name }}
          SECRET_NAME: ${{ matrix.env_secret }}
          LAMBDA_ENV: ${{ secrets[matrix.env_secret] }}
        run: |
          set -euo pipefail

          if [ -z "${LAMBDA_ENV:-}" ]; then
            echo "Secret $SECRET_NAME is not set - leaving the environment alone."
            exit 0
          fi

          if ! printf '%s' "$LAMBDA_ENV" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::Secret $SECRET_NAME must be a JSON object like {\"VAR\": \"value\"}"
            exit 1
          fi

          # GitHub masks the secret as a whole, but not the fields inside it.
          printf '%s' "$LAMBDA_ENV" | jq -r '.[] | tostring' | while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

          printf '%s' "$LAMBDA_ENV" | jq -c '{Variables: map_values(tostring)}' \
            > "$RUNNER_TEMP/env.json"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "file://$RUNNER_TEMP/env.json" \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"

          echo "Environment variables updated: $(printf '%s' "$LAMBDA_ENV" | jq 'length')"
