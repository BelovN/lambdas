# Деплой лямбд в AWS при пуше/мерже в main.
#
# Директория функции — та, где лежит lambda_function.py. Имя директории должно
# совпадать с именем функции в AWS. Деплоятся только изменённые директории.
#
# Что нужно настроить один раз:
#   1. В AWS создать OIDC identity provider для token.actions.githubusercontent.com
#      (audience sts.amazonaws.com) и IAM-роль с правами
#      lambda:UpdateFunctionCode, lambda:UpdateFunctionConfiguration,
#      lambda:GetFunction на нужные функции.
#   2. В trust policy роли условие на sub писать в НОВОМ формате GitHub, где
#      в клейм подставляются числовые id владельца и репозитория:
#        repo:BelovN@68339775/lambdas@1355115369:ref:refs/heads/main
#      Старый формат repo:BelovN/lambdas:ref:refs/heads/main больше не
#      совпадает и даёт AccessDenied на sts:AssumeRoleWithWebIdentity.
#      Реальный sub всегда видно в CloudTrail в событии AssumeRoleWithWebIdentity.
#   3. Settings → Secrets and variables → Actions:
#        secret AWS_ROLE_ARN  — ARN этой роли
#        variable AWS_REGION  — регион лямбд (по умолчанию eu-north-1)

name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions:
        description: "Имена функций через пробел (пусто — задеплоить все)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambdas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Определить изменённые функции
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FUNCTIONS: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t ALL < <(
            find . -mindepth 2 -maxdepth 2 -name lambda_function.py -printf '%h\n' \
              | sed 's|^\./||' | sort
          )

          # Оставляет из stdin только строки, которые реально являются директориями функций
          pick() { grep -Fxf <(printf '%s\n' "${ALL[@]}") || true; }

          if [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUT_FUNCTIONS" ]; then
            SELECTED=$(printf '%s\n' $INPUT_FUNCTIONS | pick)
          elif [ "$EVENT" = workflow_dispatch ]; then
            SELECTED=$(printf '%s\n' "${ALL[@]}")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            SELECTED=$(git diff --name-only "$BEFORE" "$SHA" | cut -s -d/ -f1 | sort -u | pick)
          else
            # первый пуш в ветку или force-push: базы для diff нет, деплоим всё
            SELECTED=$(printf '%s\n' "${ALL[@]}")
          fi

          JSON=$(printf '%s\n' "$SELECTED" | sed '/^$/d' \
            | jq -R '{name: ., env_secret: ("LAMBDA_ENV_" + (ascii_upcase | gsub("-"; "_")))}' \
            | jq -sc .)
          echo "Функции к деплою: $JSON"
          echo "functions=$JSON" >> "$GITHUB_OUTPUT"
          if [ "$JSON" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Деплой ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.functions) }}
    steps:
      - uses: actions/checkout@v4

      # Must match the Lambda runtime: pip resolves version-specific wheels,
      # and a cp312 wheel will not import on a python3.13 runtime.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-deploy-${{ matrix.name }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # Dependencies go inside the zip: this account uses no Lambda layers.
      - name: Собрать zip
        env:
          FUNCTION: ${{ matrix.name }}
        run: |
          set -euo pipefail

          BUILD="$RUNNER_TEMP/build/$FUNCTION"
          mkdir -p "$BUILD"
          cp -R "$FUNCTION/." "$BUILD/"

          if [ -f "$BUILD/requirements.txt" ]; then
            pip install --quiet --requirement "$BUILD/requirements.txt" --target "$BUILD"
            rm "$BUILD/requirements.txt"
          fi
          rm -f "$BUILD/deploy.json"

          cd "$BUILD"
          zip -qr "$RUNNER_TEMP/$FUNCTION.zip" . \
            -x '*.pyc' -x '*__pycache__*' -x '.DS_Store'
          unzip -l "$RUNNER_TEMP/$FUNCTION.zip" | tail -1

      # Существующая функция обновляется; отсутствующая создаётся из deploy.json.
      # Без deploy.json создать нечего — это осознанная ошибка, а не тихий пропуск.
      - name: Создать или обновить функцию
        env:
          FUNCTION: ${{ matrix.name }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/$FUNCTION.zip"

          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION" \
              --zip-file "fileb://$ZIP" \
              --publish \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION"
            echo "Код функции обновлён."
            exit 0
          fi

          CFG="$FUNCTION/deploy.json"
          if [ ! -f "$CFG" ]; then
            echo "::error::Функции $FUNCTION нет в AWS, а $CFG отсутствует — создавать не из чего."
            exit 1
          fi

          aws lambda create-function \
            --function-name "$FUNCTION" \
            --runtime "$(jq -r '.runtime' "$CFG")" \
            --role "$(jq -r '.role' "$CFG")" \
            --handler "$(jq -r '.handler' "$CFG")" \
            --architectures "$(jq -r '.architecture // "x86_64"' "$CFG")" \
            --timeout "$(jq -r '.timeout // 30' "$CFG")" \
            --memory-size "$(jq -r '.memory_size // 128' "$CFG")" \
            --zip-file "fileb://$ZIP" \
            --publish \
            --no-cli-pager >/dev/null
          aws lambda wait function-active-v2 --function-name "$FUNCTION"
          echo "Функция создана."

          if [ "$(jq -r '.function_url // false' "$CFG")" = "true" ]; then
            aws lambda add-permission \
              --function-name "$FUNCTION" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal '*' \
              --function-url-auth-type NONE \
              --no-cli-pager >/dev/null
            URL=$(aws lambda create-function-url-config \
              --function-name "$FUNCTION" \
              --auth-type NONE \
              --query FunctionUrl --output text)
            echo "Function URL: $URL"
            echo "Function URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Секрет LAMBDA_ENV_<ИМЯ_ФУНКЦИИ> (верхний регистр, дефисы → подчёркивания)
      # должен быть JSON-объектом {"VAR": "value"}. Он ПОЛНОСТЬЮ заменяет карту
      # переменных окружения функции — правки через консоль AWS будут затёрты.
      # Если секрета нет, шаг ничего не делает.
      #
      # Пробрасывается ровно один секрет, адресованный по имени из матрицы.
      # toJSON(secrets) здесь использовать нельзя: выгрузка всех секретов разом —
      # это канонический паттерн эксфильтрации, и GitHub придерживает такие раны
      # на ручной аппрув как потенциально вредоносные.
      - name: Обновить переменные окружения
        env:
          FUNCTION: ${{ matrix.name }}
          SECRET_NAME: ${{ matrix.env_secret }}
          LAMBDA_ENV: ${{ secrets[matrix.env_secret] }}
        run: |
          set -euo pipefail

          if [ -z "${LAMBDA_ENV:-}" ]; then
            echo "Секрет $SECRET_NAME не задан — переменные окружения не трогаем."
            exit 0
          fi

          if ! printf '%s' "$LAMBDA_ENV" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::Секрет $SECRET_NAME должен быть JSON-объектом вида {\"VAR\": \"value\"}"
            exit 1
          fi

          # GitHub маскирует секрет целиком, но не отдельные поля внутри JSON
          printf '%s' "$LAMBDA_ENV" | jq -r '.[] | tostring' | while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

          printf '%s' "$LAMBDA_ENV" | jq -c '{Variables: map_values(tostring)}' \
            > "$RUNNER_TEMP/env.json"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION" \
            --environment "file://$RUNNER_TEMP/env.json" \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"

          echo "Переменных окружения обновлено: $(printf '%s' "$LAMBDA_ENV" | jq 'length')"
