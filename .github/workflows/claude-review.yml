# Reviews every pull request against REVIEW.md.
#
# Setup: install https://github.com/apps/claude, run `claude setup-token`, and
# store the result as the CLAUDE_CODE_OAUTH_TOKEN secret.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Without this the inline-comment MCP server never starts and the
          # review goes to the run log instead of the pull request.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review this pull request.

            Read CLAUDE.md and REVIEW.md first. REVIEW.md is this repository's
            checklist and takes precedence.

            Leave inline comments on the lines they concern. In the summary,
            give a one-line verdict and list findings by importance, each
            marked blocking or nit. Skip anything ruff or pytest already
            covers. If there is nothing to report, say so in one line rather
            than inventing a nit.
