# Answers @claude in an issue, a pull request, or a review thread, and pushes
# fixes to the branch. Needs the same setup as claude-review.yml.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    name: Answer @claude
    # Without this the job starts on every comment in the repository.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token is deliberately not passed: GitHub does not trigger
          # workflows on commits made with the default GITHUB_TOKEN, so CI
          # would never run on the fixes pushed from here.
          claude_args: |
            --allowed-tools "Bash(pip install:*),Bash(python -m pytest:*),Bash(pytest:*),Bash(ruff:*),Bash(python:*)"
          prompt: |
            Read CLAUDE.md and REVIEW.md before changing anything.

            Before pushing, run what CI runs:
              pip install --requirement requirements-dev.txt
              ruff check .
              pytest

            A new Lambda is a new directory with lambda_function.py,
            requirements.txt and deploy.json. deploy.yml needs no edits for
            it. Cover the new function with tests in tests/.
