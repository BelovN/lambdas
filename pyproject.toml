# Tooling config only. There is no package here: every Lambda directory is its
# own deployment bundle and is never installed.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # Both handlers deliberately catch everything: a Lambda must answer with a
    # status code rather than let the runtime surface a stack trace.
    "BLE001",
    # Telegram/Shopify strings are user-facing Russian text, not code.
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff.lint.isort]
# tests/ is on sys.path via pythonpath, so conftest is ours, not a dependency.
known-first-party = ["conftest"]
